# ---------- Application ----------
# Demo site: https://www.saucedemo.com (public practice site)
base.url=https://www.saucedemo.com/
username=standard_user
password=secret_sauce
invalid.username=locked_out_user

# ---------- Browser ----------
# chrome | firefox | edge
browser=chrome
headless=false

# ---------- Timeouts (seconds) ----------
implicit.wait=0
explicit.wait=10
page.load.timeout=30

# ---------- Retry ----------
# How many times a failed/broken test is re-run (0 = no retry). Override: -Dretry.count=1
retry.count=2
